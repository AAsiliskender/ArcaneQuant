[project]
name = "arcanequant"
description = "A framework for algorithmic and medium/high-frequency trading"
authors = [{ name = "Ahmed Asiliskender", email = "ahmedasiliskender@gmail.com" }]
maintainers = [{ name = "Ahmed Asiliskender", email = "ahmedasiliskender@gmail.com" }]
readme = "README.md"
requires-python = "==3.14"

# This is for normal python env
dependencies = [
    # Core dependencies
    "pandas == 3.0.5",
    "numpy == 2.5.2",
    "sqlalchemy == 2.0.52",
    "psycopg2 == 2.9.12",
    "pathlib == 1.0.1",
    "requests == 2.34.2",
    "urllib3 == 2.7.0",
    "typing == 3.7.4",
    "json == 2.0.9",
    "pytest == 9.1.1",
    "PySide6 == 6.11.1",
    "dotenv == 0.9.9",

    # For now, also get non_core and auxiliary dependencies
    "arcanequant[non_core, auxiliary]"
]

[project.optional-dependencies]
all = [
    "arcanequant[non_core,auxiliary]",
]
non_core = [
    # Non-core dependencies        
    "colorama == 0.4.6",
    "jupyter_client == 8.9.1",
    "jupyter_core == 5.9.1",
    "matplotlib-inline == 0.2.2",
    ]

auxiliary = [
    # Auxiliary dependencies
    "matplotlib == 3.11.1",
    "scipy == 1.18.0",
    "beautifulsoup4 == 4.15.0",
    "statsmodels == 0.14.6",    
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"